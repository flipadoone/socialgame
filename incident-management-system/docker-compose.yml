services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: nemolandia_backend
    restart: unless-stopped

    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200,http://localhost:5173,http://127.0.0.1:5173}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      HIBERNATE_SQL_LOG_LEVEL: info
      HIBERNATE_BIND_LOG_LEVEL: info

    ports:
      - "8080:8080"

    networks:
      - nemolandia_network

    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --tries=1 --spider http://localhost:8080/v3/api-docs || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: nemolandia_frontend
    restart: unless-stopped

    ports:
      - "4200:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - nemolandia_network

  room-server:
    build:
      context: ../socialgame
      dockerfile: Dockerfile.server
    container_name: nemolandia_room_server
    restart: unless-stopped

    environment:
      ROOM_BEAT_PORT: 8787
      ROOM_JWT_SECRET: ${JWT_SECRET}
      ROOM_ALLOWED_ORIGINS: ${ROOM_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}

    ports:
      - "8787:8787"

    volumes:
      - nemolandia_room_data:/data

    networks:
      - nemolandia_network

volumes:
  nemolandia_room_data:
    name: nemolandia_room_data

networks:
  nemolandia_network:
    name: nemolandia_network
    driver: bridge