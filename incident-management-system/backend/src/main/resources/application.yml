spring:
  application:
    name: incident-management-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/incident_management}
    username: ${DATABASE_USERNAME:viaappia}
    password: ${DATABASE_PASSWORD:viaappia123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cache:
    type: caffeine
    cache-names:
      - incidents
      - incidentById
      - stats
      - commentsByIncident
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:debug}
    org.hibernate.orm.jdbc.bind: ${HIBERNATE_BIND_LOG_LEVEL:trace}

app:
  jwt:
    # Mesmo segredo usado pelo servidor multiplayer do jogo (ROOM_JWT_SECRET). Troque em produção.
    secret: ${JWT_SECRET:viaappia-incident-management-system-secret-key-minimum-32-characters}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174}
  seed:
    demo-users: ${SEED_DEMO_USERS:true}
